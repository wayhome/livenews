[project]
name = "livenews"
version = "0.1.0"
description = "Developer news aggregator for Hacker News, GitHub Trending, and Product Hunt"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4==4.12.3",
    "html2text==2020.1.16",
    "jinja2==3.1.2",
    "markupsafe==2.1.3",
    "openai==1.59.5",
    "python-dateutil==2.8.2",
    "python-dotenv==1.0.0",
    "pytz==2023.3",
    "requests==2.31.0",
]

[dependency-groups]
dev = [
    "pytest==8.0.0",
    "pytest-cov==4.1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
python_files = ["test_*.py"]
